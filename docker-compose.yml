version: '3.8'

services:
  # Din Python Audio Processing Backend (nu kallad audio-server)
  audio-server:
    build: ./python-audio-processing
    ports:
      - "5000:5000"
    volumes:
      - ./python-audio-processing/separated:/app/separated
      - ./python-audio-processing/non-seperated:/app/non-seperated

  # Din React Frontend
  client:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - audio-server